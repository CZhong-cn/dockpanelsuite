name: Windows build and tests

on:
  push:
    branches: [master, 'feature/**']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true

jobs:
  portable:
    name: Portable WPF layout logic (Linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.428
      - name: Test shared drop-target geometry
        run: dotnet test WpfLogicTests/WpfLogicTests.csproj -c Release --logger trx --results-directory artifacts/portable
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portable-test-results
          path: artifacts/portable/**
          if-no-files-found: warn

  modern:
    name: Desktop tests (${{ matrix.framework }})
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        framework: [net48, netcoreapp3.1, net6.0-windows]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            3.1.426
            6.0.428
      - name: Build native WPF sample
        run: dotnet build WpfSample/WpfSample.csproj -c Release -f ${{ matrix.framework }} -p:TargetFrameworks=${{ matrix.framework }}
      - name: Test WinForms on the requested runtime
        if: matrix.framework != 'net48'
        run: dotnet test Tests.Modern/Tests.Modern.csproj -c Release -f ${{ matrix.framework }} -p:TargetFrameworks=${{ matrix.framework }} --logger trx --results-directory artifacts/tests/winforms
      - name: Test native WPF on the requested runtime
        run: dotnet test WpfTests/WpfTests.csproj -c Release -f ${{ matrix.framework }} -p:TargetFrameworks=${{ matrix.framework }} --logger trx --results-directory artifacts/tests/wpf
      - name: Launch WPF sample and capture a screenshot
        shell: pwsh
        run: |
          $env:DPS_SMOKE_OUTPUT = Join-Path $PWD 'artifacts/smoke'
          $app = Join-Path $PWD 'WpfSample/bin/Release/${{ matrix.framework }}/WpfSample.exe'
          $process = Start-Process -FilePath $app -ArgumentList '--smoke' -PassThru
          if (-not $process.WaitForExit(60000)) {
            $process.Kill()
            throw 'WPF smoke test timed out.'
          }
          if ($process.ExitCode -ne 0) { throw "WPF sample exited with $($process.ExitCode)." }
          foreach ($image in @('wpf-sample.png', 'wpf-sample-light.png', 'wpf-sample-dark.png', 'wpf-auto-hide.png', 'wpf-sample-compact.png', 'wpf-sample-compact-scrolled.png', 'wpf-docking-guides-light.png', 'wpf-docking-guides-dark.png', 'wpf-nested-layout-dark.png', 'wpf-nested-layout-light.png', 'wpf-nested-docking-guides.png', 'wpf-tool-group-dark.png', 'wpf-tool-group-light.png', 'wpf-tool-group-autohide.png', 'wpf-tool-group-flyout.png', 'wpf-sample-greendark.png', 'wpf-docking-guides-greendark.png', 'wpf-tool-group-greendark.png', 'wpf-tool-group-flyout-greendark.png')) {
            if (-not (Test-Path "$env:DPS_SMOKE_OUTPUT/$image")) { throw "Smoke screenshot missing: $image" }
          }
      - name: Upload tests, screenshot and runnable sample
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.framework }}
          path: |
            artifacts/**
            WpfSample/bin/Release/${{ matrix.framework }}/**
          if-no-files-found: warn

  compatibility:
    name: Full solution and .NET Framework regression tests
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            3.1.426
            6.0.428
      - uses: microsoft/setup-msbuild@v2
      - name: Build all WinForms targets, themes, samples and WPF projects
        run: msbuild WinFormsUI.Docking.sln /restore /m /p:Configuration=Release
      - name: Run the original three test suites
        shell: pwsh
        run: |
          foreach ($project in @('Tests', 'Tests2', 'Tests3')) {
            dotnet test "$project/$project.csproj" -c Release --no-build --logger trx --results-directory "artifacts/tests/$project"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Pack native WPF library
        run: dotnet pack WpfUI/WpfUI.csproj -c Release --no-build -o artifacts/packages
      - name: Upload packages and original test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-packages
          path: |
            artifacts/**
            WinFormsUI/bin/Release/*.nupkg
          if-no-files-found: warn
